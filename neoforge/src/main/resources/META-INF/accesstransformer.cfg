# Mirror of common/src/main/resources/storagedrawers.accesswidener, in AT form. ModDevGradle
# applies this file by default and it patches the Minecraft jar that :common is compiled
# against, so the two MUST stay in sync: every entry here exists because a :common source
# file needs it.
#
# An entry naming a member that no longer exists is a HARD mod-load failure, so any edit
# must be re-checked against the real jar (tools/at_check.py), not assumed.
#
# NOT mirrored from the Fabric widener: BlockEntityRenderers.register, MenuScreens.register
# and ItemModels.ID_MAPPER. NeoForge registers all three through events instead
# (RegisterRenderers, RegisterMenuScreensEvent, RegisterItemModelsEvent), so nothing on this
# loader touches those members.
#
# Dropped from the 1.21.10 version of this file, all four dead on 26.x:
#   RecipeManager.getRecipes (both the SRG m_44054_ line and the named one) — gone; the
#     mod reads the `recipes` field below instead.
#   AbstractContainerScreen.renderSlotHighlightFront — renamed extractSlotHighlightFront,
#     zero call sites in this mod.
#   BlockModel.getElements — BlockModel is now an interface; JSON models are CuboidModel,
#     whose geometry() accessor is already public.
#   GuiGraphics.<init> and GameRenderer.guiRenderState — GuiGraphics is now
#     GuiGraphicsExtractor and it owns the render state itself (see below).

